<!-- Film grain aesthetic overlay -->
<div class="film-grain-overlay" aria-hidden="true"></div>

<!-- Phase 0: Global Loader -->
<app-loader (loaded)="onLoaderComplete()"></app-loader>

<!-- Main Experience Container -->
<div class="experience-shell">
  <!-- Phase 8: Vertical Side Progress Dock with Traveling Rocket -->
  <app-progress-rocket></app-progress-rocket>

  <!-- Pinned Master Viewport: All Scenes Live Here -->
  <main class="cinematic-viewport" id="main-content">
    <!-- Scene 1: Launch Pad (Active in Phase 1: 0% - 15%) -->
    <div 
      class="scene-wrapper"
      [class.scene-active]="masterTimeline.activeSceneIndex() === 0"
      [style.opacity]="masterTimeline.getSceneVisibility(0).opacity"
    >
      <app-launch-pad (launchCompleted)="onLaunchCompleted()"></app-launch-pad>
    </div>

    <!-- Scene 2: Atmosphere & Orbit (Active in Phase 2: 15% - 30%) -->
    <div 
      class="scene-wrapper"
      [class.scene-active]="masterTimeline.activeSceneIndex() === 1"
      [style.opacity]="masterTimeline.getSceneVisibility(1).opacity"
    >
      <app-orbit></app-orbit>
    </div>

    <!-- Scene 3: Relic Odyssey Flight Corridor (Active in Phase 3: 22% - 100%) -->
    <div 
      class="scene-wrapper"
      [class.scene-active]="masterTimeline.activeSceneIndex() === 2"
      [style.opacity]="masterTimeline.getSceneVisibility(2).opacity"
      id="missions-section"
    >
      <app-solar-system (openMission)="openMissionModal($event)"></app-solar-system>
    </div>
  </main>

  <!-- Phase 7: HUD Helmet Visor Mission Modal -->
  <app-hud-modal
    [mission]="selectedMission()"
    (closeModalEvent)="closeMissionModal()"
    (missionCompletedEvent)="onMissionCompleted($event)"
  ></app-hud-modal>

  <!-- Phase 3: Five-Step Space Explorer Passport Modal -->
  <app-explorer-passport
    [isOpen]="isPassportOpen()"
    (closeModal)="closePassport()"
  ></app-explorer-passport>

  <!-- Phase 4: Mission Control Center Modal -->
  <app-mission-control
    [isOpen]="isMissionControlOpen()"
    (closeModal)="closeMissionControl()"
    (launchMissionEvent)="launchMissionFromControl($event)"
  ></app-mission-control>

  <!-- Phase 4: Personal Explorer Profile & Achievements Modal -->
  <app-explorer-profile
    [isOpen]="isExplorerProfileOpen()"
    (closeModal)="closeExplorerProfile()"
    (openPassportEvent)="openPassport()"
  ></app-explorer-profile>

  <!-- Phase 4: Real-time Achievement Unlocked Toast Notification -->
  <app-achievement-toast></app-achievement-toast>

  <!-- Master Scroll Track Driving ScrollTrigger (600vh height for silky smooth travel) -->
  <div #masterTrack class="master-scroll-track" aria-hidden="true"></div>
</div>
