<!-- Film grain aesthetic overlay -->
<div class="film-grain-overlay" aria-hidden="true"></div>

<!-- Phase 0: Global Loader -->
<app-loader (loaded)="onLoaderComplete()"></app-loader>

<!-- Main Experience Container -->
<div class="experience-shell">
  <!-- Top Navigation HUD / Boarding Header -->
  <header class="hud-header" role="banner">
    <!-- Skip to missions accessibility link -->
    <a 
      href="#missions-section" 
      class="skip-link"
      (click)="$event.preventDefault(); skipToMissions()"
    >
      {{ i18n.currentTranslations().skipToMissions }}
    </a>

    <!-- Left (in LTR) / Right (in RTL): Space Center Badge -->
    <div class="facility-identity">
      <div class="facility-logo">
        <svg viewBox="0 0 32 32" class="facility-logo-svg" fill="none">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M16 6L20 18H12L16 6Z" fill="var(--accent-glow)"/>
          <circle cx="16" cy="22" r="2.5" fill="var(--accent-sand)"/>
        </svg>
      </div>
      <div class="facility-text">
        <span class="facility-title">{{ i18n.currentTranslations().siteTitle }}</span>
        <span class="facility-sub">{{ i18n.currentTranslations().subTitle }}</span>
      </div>
    </div>

    <!-- Center Coordinates Badge (Boarding Pass Detail) -->
    <div class="header-coordinates">
      <span class="coord-tag">LOC // ASYUT-EG</span>
      <span class="coord-value">{{ i18n.currentTranslations().coordinates }}</span>
    </div>

    <!-- Right (in LTR) / Left (in RTL): Controls (Sound + Lang) -->
    <div class="header-controls">
      <app-sound-toggle></app-sound-toggle>
      <app-language-toggle></app-language-toggle>
    </div>
  </header>

  <!-- Pinned Master Viewport: All Scenes Live Here -->
  <main class="cinematic-viewport" id="main-content">
    <!-- Scene 1: Launch Pad (Active in Phase 1: 0% - 15%) -->
    <div 
      class="scene-wrapper"
      [class.scene-active]="masterTimeline.activeSceneIndex() === 0"
      [style.opacity]="masterTimeline.getSceneVisibility(0).opacity"
    >
      <app-launch-pad (launchCompleted)="onLaunchCompleted()"></app-launch-pad>
    </div>

    <!-- Scene 2: Atmosphere & Orbit (Active in Phase 2: 15% - 30%) -->
    <div 
      class="scene-wrapper"
      [class.scene-active]="masterTimeline.activeSceneIndex() === 1"
      [style.opacity]="masterTimeline.getSceneVisibility(1).opacity"
    >
      <app-orbit></app-orbit>
    </div>
  </main>

  <!-- Master Scroll Track Driving ScrollTrigger (600vh height for silky smooth travel) -->
  <div #masterTrack class="master-scroll-track" aria-hidden="true"></div>
</div>
